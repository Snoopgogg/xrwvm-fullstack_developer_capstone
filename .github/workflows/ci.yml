name: Car Dealership Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Compile Django application
        run: python -m compileall -q server/djangoapp server/djangoproj server/manage.py

      - name: Run Django system checks
        working-directory: server
        run: python manage.py check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Node.js microservice syntax
        run: |
          node --check server/database/app.js
          node --check server/database/dealership.js
          node --check server/database/review.js
          node --check server/database/inventory.js

      - name: Workflow completed
        run: echo "Car Dealership Capstone validation completed."
