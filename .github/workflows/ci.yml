name: Car Dealership Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linter
        run: python -m pip install --upgrade pip ruff
      - name: Run Linter
        run: ruff check server --select E9,F63,F7,F82 --output-format github
      - name: Post Run Linter
        if: always()
        run: echo "Python lint job finished."
      - name: Complete job
        run: echo "Lint Python Files completed."

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: server/frontend
        run: npm install --no-audit --no-fund
      - name: Run Linter
        working-directory: server/frontend
        run: npm run build
      - name: Validate Node.js API syntax
        run: |
          node --check server/database/app.js
          node --check server/database/dealership.js
          node --check server/database/review.js
          node --check server/database/inventory.js
      - name: Post Run Linter
        if: always()
        run: echo "JavaScript validation job finished."
      - name: Complete job
        run: echo "Lint JavaScript Files completed."

  django-checks:
    name: Django Application Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Django dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
      - name: Run Django checks
        working-directory: server
        run: python manage.py check
      - name: Apply database migrations
        working-directory: server
        run: python manage.py migrate --run-syncdb --noinput
      - name: Populate the car catalogue
        working-directory: server
        run: python manage.py shell -c "from djangoapp.populate import initiate; print(initiate())"
