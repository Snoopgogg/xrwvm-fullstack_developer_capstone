<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | Cars Dealership</title><link rel="stylesheet" href="/static/bootstrap.min.css"><link rel="stylesheet" href="/static/style.css"><style>body{background:#f3f6f8;font-family:Arial,sans-serif}.nav{background:#102b44;color:#fff;padding:18px 5%;display:flex;gap:26px}.nav a{color:white;text-decoration:none}.brand{font-weight:800;font-size:22px;margin-right:20px}.card{max-width:460px;margin:55px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 6px 24px #0001}.field{display:flex;flex-direction:column;gap:7px;margin:16px 0}input{padding:12px;border:1px solid #bdcbd5;border-radius:7px}.btn{background:#087e8b;color:white;padding:12px;border:0;border-radius:7px;width:100%;font-weight:700}</style></head>
<body><header class="nav"><span class="brand">Cars Dealership</span><a href="/">Home</a><a href="/about">About Us</a><a href="/contact">Contact Us</a></header>
<main class="card"><h1>Login</h1><p>Sign in to review a dealership.</p><form id="login-form"><div class="field"><label for="username">Username</label><input id="username" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">Login</button></form><p id="message" role="status"></p><p>New user? <a href="/register">Register here</a></p></main>
<script>
document.getElementById("login-form").addEventListener("submit",async e=>{e.preventDefault();const username=document.getElementById("username").value;const password=document.getElementById("password").value;const r=await fetch("/djangoapp/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userName:username,password})});const d=await r.json();if(r.ok&&d.status==="Authenticated"){sessionStorage.setItem("username",d.userName);location.href="/";}else{document.getElementById("message").textContent=d.status||d.error||"Login failed";}});
</script></body></html>
