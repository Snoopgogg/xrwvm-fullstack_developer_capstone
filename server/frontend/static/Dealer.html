<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dealer Details</title><link rel="stylesheet" href="/static/bootstrap.min.css"><link rel="stylesheet" href="/static/style.css">
<style>body{margin:0;background:#f3f6f8;color:#203040;font-family:Arial,sans-serif}.nav{background:#102b44;color:#fff;padding:18px 5%;display:flex;gap:28px;align-items:center}.nav a{color:#eef8ff;text-decoration:none;font-weight:600}.brand{font-size:22px;font-weight:800;margin-right:20px}.user{margin-left:auto;color:#a8f1eb}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.hero{background:linear-gradient(120deg,#143b5c,#137b82);color:white;border-radius:14px;padding:30px;margin-bottom:22px}.panel{background:#fff;border:1px solid #dce4eb;border-radius:12px;padding:24px;box-shadow:0 3px 12px #162d4510}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.grid div{padding:14px;background:#f3f7f9;border-radius:8px}.grid small{display:block;color:#667788}.review{border:1px solid #dfe8ee;border-left:4px solid #13a49b;padding:16px;border-radius:8px;margin:13px 0}.btn{background:#087e8b;color:#fff;padding:10px 15px;border-radius:7px;text-decoration:none;font-weight:700}.footer{text-align:center;padding:26px;color:#71808e}</style></head>
<body><header class="nav"><span class="brand">🚘 Cars Dealership</span><a href="/">Home</a><a href="/about">About Us</a><a href="/contact">Contact Us</a><span class="user" id="user"></span></header>
<main class="wrap"><section class="hero"><h1>Dealer Details and Customer Reviews</h1><p>Review dealer information and customer feedback.</p></section><section class="panel" id="details">Loading dealer details…</section></main><footer class="footer">Cars Dealership · Full Stack Development Capstone</footer>
<script>
const dealerId={{ dealer_id }};
document.getElementById("user").textContent=sessionStorage.getItem("username")||"";
Promise.all([fetch("/djangoapp/dealer/"+dealerId).then(r=>r.json()),fetch("/djangoapp/reviews/dealer/"+dealerId).then(r=>r.json())]).then(([dealerData,reviewData])=>{
const d=(dealerData.dealer||[])[0];if(!d){document.getElementById("details").textContent="Dealer not found";return;}
const reviews=reviewData.reviews||[];
document.getElementById("details").innerHTML='<h2>'+d.full_name+'</h2><div class="grid"><div><small>Dealer ID</small><b>'+d.id+'</b></div><div><small>City</small><b>'+d.city+'</b></div><div><small>State</small><b>'+d.state+'</b></div><div><small>ZIP</small><b>'+d.zip+'</b></div></div><p><b>Address:</b> '+d.address+', '+d.city+', '+d.state+' '+d.zip+'</p><a class="btn" href="/postreview/'+d.id+'">Post Review</a><h2 style="margin-top:28px">Customer Reviews</h2>'+reviews.map(r=>'<article class="review"><b>'+r.name+'</b><p>'+r.review+'</p><p class="muted">'+r.car_make+' '+r.car_model+' '+r.car_year+' · Purchased: '+(r.purchase?'Yes':'No')+'</p></article>').join('')+(reviews.length?'':'<p>No reviews yet.</p>');
}).catch(()=>{document.getElementById("details").textContent="Unable to load dealer details.";});
</script></body></html>
