<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Post a Review</title><link rel="stylesheet" href="/static/bootstrap.min.css"><link rel="stylesheet" href="/static/style.css">
<style>body{margin:0;background:#f3f6f8;color:#203040;font-family:Arial,sans-serif}.nav{background:#102b44;color:#fff;padding:18px 5%;display:flex;gap:28px;align-items:center}.nav a{color:#eef8ff;text-decoration:none;font-weight:600}.brand{font-size:22px;font-weight:800;margin-right:20px}.user{margin-left:auto;color:#a8f1eb}.wrap{max-width:1000px;margin:28px auto;padding:0 20px}.hero{background:linear-gradient(120deg,#143b5c,#137b82);color:white;border-radius:14px;padding:30px;margin-bottom:22px}.panel{background:#fff;border:1px solid #dce4eb;border-radius:12px;padding:24px;box-shadow:0 3px 12px #162d4510}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-weight:700;color:#36516a}input,textarea,select{border:1px solid #bac9d4;border-radius:6px;padding:11px;font:inherit}textarea{min-height:130px}.btn{background:#087e8b;color:white;padding:11px 18px;border:0;border-radius:7px;font-weight:700;cursor:pointer}.footer{text-align:center;padding:26px;color:#71808e}</style></head>
<body><header class="nav"><span class="brand">🚘 Cars Dealership</span><a href="/">Home</a><a href="/about">About Us</a><a href="/contact">Contact Us</a><span class="user" id="user"></span></header>
<main class="wrap"><section class="hero"><h1>Post a Dealer Review</h1><p>Share your dealership experience.</p></section><section class="panel"><h2 id="dealer-name">Review Form</h2><form id="review-form" class="formgrid">
<div class="field full"><label for="review">Your Review</label><textarea id="review" required placeholder="Write your experience..."></textarea></div>
<div class="field"><label for="purchase-date">Purchase Date</label><input id="purchase-date" type="date" required></div>
<div class="field"><label for="car">Car Make and Model</label><select id="car" required></select></div>
<div class="field"><label for="car-year">Car Year</label><input id="car-year" type="number" min="2015" max="2023" value="2022" required></div>
<div class="field"><label for="purchased">Did you purchase this vehicle?</label><select id="purchased"><option value="true">Yes</option><option value="false">No</option></select></div>
<div class="field full"><button class="btn" type="submit">Post Review</button></div>
</form><p id="message" role="status"></p></section></main><footer class="footer">Cars Dealership · Full Stack Development Capstone</footer>
<script>
const dealerId={{ dealer_id }};const username=sessionStorage.getItem("username")||"";
document.getElementById("user").textContent=username;
Promise.all([fetch("/djangoapp/dealer/"+dealerId).then(r=>r.json()),fetch("/djangoapp/get_cars").then(r=>r.json())]).then(([dealerData,carData])=>{
const d=(dealerData.dealer||[])[0];document.getElementById("dealer-name").textContent=d?d.full_name:"Dealer Review";
document.getElementById("car").innerHTML=(carData.CarModels||[]).map(c=>'<option value="'+c.CarMake+'|'+c.CarModel+'">'+c.CarMake+' '+c.CarModel+'</option>').join("");
});
document.getElementById("review-form").addEventListener("submit",async e=>{
e.preventDefault();const [make,model]=document.getElementById("car").value.split("|");
const body={name:username||"Guest Reviewer",dealership:dealerId,review:document.getElementById("review").value,purchase:document.getElementById("purchased").value==="true",purchase_date:document.getElementById("purchase-date").value,car_make:make,car_model:model,car_year:Number(document.getElementById("car-year").value)};
const response=await fetch("/djangoapp/add_review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
const result=await response.json();if(response.ok){location.href="/dealer/"+dealerId;}else{document.getElementById("message").textContent=result.error||"Unable to save review.";}
});
</script></body></html>
